<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>填写表单 · x-form</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18243b;
      --muted: #71809b;
      --line: #e4eaf3;
      --blue: #4263eb;
      --green: #218653;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 46px 18px; color: var(--ink); background: linear-gradient(145deg, #eef3ff 0%, #f7f9fd 46%, #f0f6f5 100%); }
    .page { width: min(720px, 100%); margin: 0 auto; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 9px; margin-bottom: 19px; color: #596986; font-weight: 700; letter-spacing: .2px; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: white; background: linear-gradient(135deg, #84a4ff, #536dfe); }
    .card { overflow: hidden; background: white; border: 1px solid #e9edf5; border-radius: 18px; box-shadow: 0 20px 60px #34456e12; }
    .accent { height: 6px; background: linear-gradient(90deg, #4263eb, #6d8bff 50%, #65c7a5); }
    .card-body { padding: 34px 42px 38px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.35; letter-spacing: -.5px; }
    .description { margin: 11px 0 28px; color: var(--muted); line-height: 1.75; font-size: 14px; white-space: pre-wrap; }
    .field { margin: 0 0 22px; }
    .field-label { display: block; margin: 0 0 8px; color: #36445f; font-size: 13px; font-weight: 700; }
    .required { margin-left: 4px; color: #d45656; }
    .control { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #dce3ef; border-radius: 9px; background: white; color: var(--ink); outline: none; font: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    .control:focus { border-color: #8298ff; box-shadow: 0 0 0 3px #4263eb16; }
    textarea.control { min-height: 110px; resize: vertical; }
    .hint { margin-top: 6px; color: #98a3b6; font-size: 12px; }
    .choice-list { display: grid; gap: 9px; }
    .choice { display: flex; align-items: center; gap: 9px; color: #56637d; font-size: 14px; }
    .choice input { accent-color: var(--blue); width: 16px; height: 16px; }
    .notice { margin: 15px 0 0; color: #b34141; font-size: 13px; line-height: 1.5; }
    .submit { width: 100%; margin-top: 4px; min-height: 46px; border: 0; border-radius: 9px; background: var(--blue); color: white; font: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 7px 15px #4263eb28; }
    .submit:hover { background: #304ec4; }
    .submit:disabled { opacity: .65; cursor: wait; }
    .footer { margin-top: 17px; text-align: center; color: #98a3b6; font-size: 12px; }
    .state { padding: 56px 30px; text-align: center; }
    .state-icon { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 50%; margin: 0 auto 15px; background: #e9f8f0; color: var(--green); font-size: 25px; }
    .state.error .state-icon { background: #fff0f0; color: #c65151; }
    .state h1 { font-size: 22px; }
    .state p { margin: 10px 0 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      body { padding: 25px 12px; }
      .card-body { padding: 27px 21px 29px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><span class="brand-mark">x</span><span>x-form</span></div>
    <section class="card">
      <div class="accent"></div>
      <div class="card-body" id="form-view" hidden>
        <h1 id="form-title"></h1>
        <p class="description" id="form-description"></p>
        <form id="submission-form"></form>
      </div>
      <div class="state" id="loading-state">
        <div class="state-icon" style="background:#eef1ff;color:#4263eb">…</div>
        <h1>正在加载表单</h1>
        <p>请稍候。</p>
      </div>
      <div class="state error" id="error-state" hidden>
        <div class="state-icon">!</div>
        <h1>无法打开表单</h1>
        <p id="error-message">请检查链接是否正确，或联系表单创建者。</p>
      </div>
      <div class="state" id="success-state" hidden>
        <div class="state-icon">✓</div>
        <h1>提交成功</h1>
        <p>感谢填写，您的内容已保存。</p>
      </div>
    </section>
    <div class="footer">由 x-form 提供</div>
  </main>

  <script src="../assets/api.js"></script>
  <script src="../assets/user.js"></script>
</body>
</html>
